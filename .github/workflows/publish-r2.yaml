name: Publish to R2

# Publishes the VanaCore addons in addons/vanacore/ to the VanaCore build on R2, into its addons\vanacore\ folder, the
# way the Addon Updater (addon_updater.yaml) publishes the addons pinned in addons.json: only files that changed go
# up, then launcher.json and the build's state, so the launcher fetches them on its next check. Only the vanacore tag's
# build for now (the "tags" input). See .github/scripts/publish_r2.py.
#
# Secrets, the launcher repository's: R2_S3_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, and optionally
# CLOUDFLARE_ZONE_ID + CLOUDFLARE_API_TOKEN for the cache purge.

# Publishes one named commit of main, never "whatever main is now": the dry run prints the commit, and the real run
# is given the same one. R2 records which commit each addon is live from (launcher/cexi_addons_published.json).
# The job runs in the "release" environment: its R2 secrets are only handed over once a reviewer approves the run.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit of main to publish (full hash; the dry run prints it)
        type: string
        required: true
      dry_run:
        description: List what would change and write nothing
        type: boolean
        default: false
      addons:
        description: Comma-separated addon folder names (blank = every addon in addons/vanacore)
        type: string
        default: ""
      tags:
        description: Comma-separated build tags to publish to
        type: string
        default: vanacore

# One publish at a time from this repository: the Addon Updater is in the same r2-publish group. Other R2 writers
# (VanaCore Release, the Manager) aren't, as a group doesn't reach across repositories: publish_r2.py reads
# launcher.json and the state again just before writing them, so the window for a clash is a second or so.
concurrency:
  group: r2-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish addons
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      # Only a commit that is on main, given in full: a branch name or a commit off main is refused.
      - name: The commit is on main
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a full 40-character hash"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$COMMIT" ] || { echo "::error::checked out $(git rev-parse HEAD), not $COMMIT"; exit 1; }
          git merge-base --is-ancestor "$COMMIT" origin/main || { echo "::error::$COMMIT isn't on main"; exit 1; }
          echo "Publishing $COMMIT ($(git log -1 --format=%s "$COMMIT"))"

      # Guards the diff and the file checks themselves: if either is broken, this fails before R2 is touched
      - name: Self-check
        run: python3 .github/scripts/test_publish_r2.py

      - name: Publish
        env:
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          ONLY: ${{ inputs.addons }}
          TAGS: ${{ inputs.tags }}
          COMMIT: ${{ inputs.commit }}
        run: |
          flags=()
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          python3 .github/scripts/publish_r2.py --only "$ONLY" --tags "$TAGS" --commit "$COMMIT" "${flags[@]}"
